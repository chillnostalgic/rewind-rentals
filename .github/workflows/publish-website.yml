# Publishes Rewind Rentals as a web page, so it can be opened in Chrome on a phone.
# That is what allows casting to a TV: Google's cast kit only works on a secure web page.
# Turn it on once: repository Settings > Pages > Source: "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather the site
        run: |
          mkdir -p _site
          cp app/src/main/assets/index.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
