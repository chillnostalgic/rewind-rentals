name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Name it
        run: cp app/build/outputs/apk/debug/app-debug.apk RewindRentals.apk

      - name: Keep a copy on this run
        uses: actions/upload-artifact@v4
        with:
          name: RewindRentals-apk
          path: RewindRentals.apk

      - name: Publish as the latest release (gives a fixed download link for the TV)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rewind Rentals build ${{ github.run_number }}
          files: RewindRentals.apk
          make_latest: true
