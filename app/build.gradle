plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rewindrentals.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rewindrentals.tv'
        minSdk 22          // Fire OS 5 and Android TV 5.1 and newer
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A fixed test key, so new builds install over old ones without uninstalling first
    signingConfigs {
        debug {
            storeFile file('../keystore/rewind-test.keystore')
            storePassword 'rewindrentals'
            keyAlias 'rewind'
            keyPassword 'rewindrentals'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
